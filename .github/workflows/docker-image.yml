name: Publish Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Resolve icloud-hme ref
        id: icloud
        run: |
          sha="$(curl -fsSL -H "Authorization: Bearer ${{ secrets.ICLOUD_HME_PAT }}" \
            "https://api.github.com/repos/zhizhishu/icloud-hme/commits/claw-gate" \
            | jq -r '.sha')"
          if [ -z "$sha" ] || [ "$sha" = "null" ]; then
            echo "无法解析 icloud-hme@claw-gate SHA（检查 ICLOUD_HME_PAT secret）" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            ICLOUD_HME_SHA=${{ steps.icloud.outputs.sha }}
            ICLOUD_HME_PAT=${{ secrets.ICLOUD_HME_PAT }}
