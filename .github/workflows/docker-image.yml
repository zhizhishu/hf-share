name: Publish Docker Image

on:
  push:
    branches:
      - main
    paths:
      - components/fusionsearch-mcp/**
      - components/clawemail/**
      - components/cloudspace/**
      - public/entry/**
      - Dockerfile
      - .dockerignore
      - .gitattributes
      - repos.lock
      - scripts/bump-lock.py
      - .github/workflows/docker-image.yml
  workflow_dispatch:

concurrency:
  group: publish-docker-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Read external private build revisions
        id: revisions
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          expected = {"ICLOUD_HME_SHA"}
          revisions = {}
          for line in Path("repos.lock").read_text(encoding="utf-8").splitlines():
              if not line.strip() or line.lstrip().startswith("#"):
                  continue
              match = re.fullmatch(r"([A-Z_]+)=([0-9a-fA-F]{40})", line)
              if not match or match[1] not in expected or match[1] in revisions:
                  raise SystemExit("Invalid or duplicate repos.lock entry")
              revisions[match[1]] = match[2]
          if set(revisions) != expected:
              keys = ", ".join(sorted(expected))
              raise SystemExit(f"repos.lock must contain exactly {len(expected)} revision key(s): {keys}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key, value in revisions.items():
                  print(f"{key}={value}", file=output)
          PY

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            ICLOUD_HME_SHA=${{ steps.revisions.outputs.ICLOUD_HME_SHA }}
          # PAT 走 BuildKit secret（id=icloud_hme_pat），不进 build-args/provenance。
          secrets: |
            "icloud_hme_pat=${{ secrets.ICLOUD_HME_PAT }}"
